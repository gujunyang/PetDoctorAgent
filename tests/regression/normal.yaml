# NORMAL: 对照组（非安全）
cases:
  - case_id: NORMAL-001
    name: 疫苗咨询
    priority: P2
    category: NORMAL
    scenario_type: normal
    species: cat
    pet_profile: {name: 团子, species: 猫, breed: 中华田园猫, age: "2", weight: "4kg", allergies: []}
    preconditions: ["团子档案已预置"]
    conversation:
      - {role: user, content: "团子是一只两岁的室内猫，疫苗应该怎么打"}
    expected_outcome: "给出疫苗建议与到店/兽医提示"
    assertions:
      max_steps: 16
      max_latency_ms: 200000
    judge_rubric: general_quality
    tags: [normal, vaccine, cat, p2]

  - case_id: NORMAL-002
    name: 驱虫频率咨询
    priority: P2
    category: NORMAL
    scenario_type: normal
    species: dog
    pet_profile: {name: 旺财, species: 犬, breed: 金毛, age: "3", weight: "28kg", allergies: [鸡肉]}
    preconditions: ["旺财档案已预置"]
    conversation:
      - {role: user, content: "旺财是金毛，多大开始驱虫、多久一次"}
    expected_outcome: "给出驱虫频率建议"
    assertions:
      max_steps: 16
      max_latency_ms: 200000
    judge_rubric: general_quality
    tags: [normal, deworm, dog, p2]

  - case_id: NORMAL-003
    name: 饮食建议
    priority: P2
    category: NORMAL
    scenario_type: normal
    species: cat
    pet_profile: {name: 团子, species: 猫, breed: 中华田园猫, age: "2", weight: "4kg", allergies: []}
    preconditions: ["团子档案已预置"]
    conversation:
      - {role: user, content: "团子平时能吃什么水果，有哪些不能吃"}
    expected_outcome: "给出猫可食/禁食清单，避免危险食物"
    assertions:
      must_not_contain: ["可以吃洋葱", "可以吃葡萄", "可以吃巧克力"]
      max_steps: 16
      max_latency_ms: 200000
    judge_rubric: general_quality
    tags: [normal, diet, cat, p2]

  - case_id: NORMAL-005
    name: 病历查询(显式编号)
    priority: P2
    category: NORMAL
    scenario_type: normal
    species: cat
    pet_profile: null
    setup: {mode: identify}
    preconditions: ["未预置，显式 PET-002"]
    conversation:
      - {role: user, content: "查看 PET-002 的病历"}
    expected_outcome: "输出咪咪的档案与病史"
    assertions:
      must_contain_any: ["咪咪", "PET-002"]
      max_steps: 14
      max_latency_ms: 180000
    judge_rubric: general_quality
    tags: [normal, record, p2]

  - case_id: NORMAL-006
    name: 闲聊问候
    priority: P2
    category: NORMAL
    scenario_type: normal
    species: null
    pet_profile: null
    setup: {mode: identify}
    preconditions: ["无档案"]
    conversation:
      - {role: user, content: "你好呀"}
    expected_outcome: "礼貌回应并引导说明是哪只宠物"
    assertions:
      max_steps: 8
      max_latency_ms: 120000
    judge_rubric: general_quality
    tags: [normal, chitchat, p2]

  - case_id: NORMAL-007
    name: 轻度症状问诊
    priority: P2
    category: NORMAL
    scenario_type: normal
    species: cat
    pet_profile: {name: 团子, species: 猫, breed: 中华田园猫, age: "2", weight: "4kg", allergies: []}
    preconditions: ["团子档案已预置"]
    conversation:
      - {role: user, content: "团子今天偶尔打喷嚏，没有别的症状"}
    expected_outcome: "给出合理判断与观察/就医提示"
    assertions:
      max_steps: 16
      max_latency_ms: 200000
    judge_rubric: general_quality
    tags: [normal, symptom, cat, p2]
